name: Tests

env:
  # Run JavaScript actions on Node 24 (Node 20 is being removed from GitHub runners).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: python -m pyflakes nolde_launcher tests main.py scripts
      - name: Test
        id: pytest
        # The process exit code is not used to decide the result: see scripts/check_junit.py.
        continue-on-error: true
        run: python -m pytest tests -q --junitxml=test-results.xml
      - name: Check test results
        run: python scripts/check_junit.py test-results.xml
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml
          if-no-files-found: ignore
