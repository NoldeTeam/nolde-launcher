name: Release

env:
  # Run JavaScript actions on Node 24 (Node 20 is being removed from GitHub runners).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# Runs when a version tag such as v0.2.0 is pushed.
# The installer is built on a Windows runner and attached to a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Check the tag matches the code version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $code = python -c "import sys; sys.path.insert(0,'.'); from nolde_launcher.app.version import __version__; print(__version__)"
          if ($tag -ne $code) { throw "Tag v$tag does not match nolde_launcher/app/version.py ($code)." }
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build installer
        shell: pwsh
        run: ./scripts/build_installer.ps1 -Version "${{ github.ref_name }}".TrimStart("v")
      - name: Write the SHA-256 file next to the installer
        # The launcher's automatic update reads this hash and refuses a download that does not match.
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist/installer/*.exe | Select-Object -First 1
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($exe.Name)" | Set-Content -Encoding ascii "$($exe.FullName).sha256"
      - name: Upload installer as artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: |
            dist/installer/*.exe
            dist/installer/*.sha256
      - name: Attach installer to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/installer/*.exe
            dist/installer/*.sha256
          body: |
            Nolde Launcher Early Access. Install the .exe, or keep an existing installation:
            the launcher checks GitHub for new releases and installs them after you agree.

            The installer is not code-signed yet, so Windows SmartScreen may show a warning.
            Check the SHA-256 in the .sha256 file before running it.
